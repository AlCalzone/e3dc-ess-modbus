[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "e3dc-ess-modbus"
version = "0.0.0"
description = "Read and control E3/DC home power stations over Modbus TCP."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "AlCalzone" }]
keywords = ["modbus", "e3dc", "hagerenergy", "energy-storage", "battery", "solar"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
# The caller injects a ModbusUnit, so the library needs no backend of its own.
dependencies = ["modbus-connection>=4.12.1,<5"]

[project.urls]
Homepage = "https://github.com/AlCalzone/e3dc-ess-modbus"

[dependency-groups]
dev = [
    # The backend script/query.py connects through.
    "modbus-connection[tmodbus]",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/e3dc_ess_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# D401 wants imperative docstrings; this codebase names things ("The protocol
# address of ..."), matching modbus-connection's own style. D107 is covered by
# the class docstring.
ignore = ["D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "script"]
strict = true

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation; docstrings are for the ones that need a why.
"tests/*" = ["D100", "D103", "D104"]
